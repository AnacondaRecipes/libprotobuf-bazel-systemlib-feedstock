package:
  name: libprotobuf-bazel-systemlib
  version: {{ libprotobuf }}

source:
  url: https://github.com/protocolbuffers/protobuf/releases/download/v{{ libprotobuf.split(".", 1)[1] }}/protobuf-{{ libprotobuf.split(".", 1)[1] }}.tar.gz
  sha256: f0b6838e7522a8da96126d487068c959bc624926368f3024ac8fd03abd0a1ac4

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - sed
  host:
    - libprotobuf {{ libprotobuf }}
  run:
    - libprotobuf {{ libprotobuf }}

test:
  requires:
    - cxx-compiler
    - c-compiler
    - bazel >=8
    - bazel-toolchain >=0.5
    - protobuf-bazel-rules
    - protobuf {{ libprotobuf }}
    - libprotobuf {{ libprotobuf }}
  files:
    - tests/
  commands:
    - test -f ${PREFIX}/share/bazel/systemlibs/protobuf/BUILD
    - bash tests/run_test.sh

about:
  home: https://protobuf.dev
  dev_url: https://github.com/conda-forge/libprotobuf-bazel-systemlib-feedstock
  doc_url: https://protobuf.dev/overview
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: Bazel rules for protobuf
  description: |
    You can use the systemlib definitions by assembling them together with
    the following lines in your build script:

    ```bash
    mkdir -p third_party/systemlibs
    cp -ap "${PREFIX}/share/bazel/systemlibs/protobuf" third_party/systemlibs/
    cp -ap "${PREFIX}/share/bazel/protobuf/bazel" third_party/systemlibs/protobuf/
    export ABSEIL_VERSION="$(conda list -p "${PREFIX}" libabseil --fields version | awk '!/^#/ && NF { print $1; exit }')"
    sed -i "s:ABSEIL_VERSION:${ABSEIL_VERSION}:" third_party/systemlibs/protobuf/MODULE.bazel
    ```

    You will also need an override in the top-level `MODULE.bazel`:

    ```python
    local_path_override(
        module_name = "protobuf",
        path = "./third_party/systemlibs/protobuf",
    )
    ```

extra:
  recipe-maintainers:
    - conda-forge/bazel
